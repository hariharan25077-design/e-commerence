<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
</head>
<body>

<div class="container">
  <h2>Login</h2>

  <form onsubmit="event.preventDefault(); loginUser();">

    <input type="password" id="password" placeholder="Password" required>
    <button class="btn">Login</button>
  </form>
</div>

</body>
</html>
